name: Refresh room list

on:
  schedule:
    - cron: '0 4 * * 1' # Mondays 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build:rooms

      - uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/refresh-rooms
          delete-branch: true
          add-paths: src/lib/data/rooms.json
          commit-message: 'chore: refresh room list'
          title: 'chore: refresh room list'
          body: Automated weekly refresh of `src/lib/data/rooms.json` via `npm run build:rooms`.
